[tool.poetry]
name = "homr"
version = "0.3.0-post.12+e0b4333"
description = "End-to-end Optical Music Recognition (OMR) system build on top of vision transformers."
authors = ["Christian Liebhardt <christian.liebhardt@arcor.de>"]
license = "AGPL-3.0"
readme = "README.md"
homepage = "https://github.com/liebharc/homr"
documentation = "https://github.com/liebharc/homr"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "2.2.6"
opencv-python-headless = "^4.12.0.88"
Pillow = "^11.3.0"
types-Pillow = "^10.2.0.20240822"
scipy = "1.15.3"
torch = "2.7.1"
typing_extensions = "^4.14.1"
transformers = "4.53.2"
x-transformers = "^2.4.9"
musicxml = "^1.4"
easyocr = "^1.7.2"
segmentation-models-pytorch = "^0.5.0"
pytorch-lightning = "^2.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
mypy = "^1.15.0"
black = "^25.1.0"
ruff = "0.11.13"
isort = "^6.0.1"
pyupgrade = "^3.20.0"
pre-commit = "^4.2.0"
pyclean = "^3.1.0"
coverage = "^7.8.2"
augly = "^1.0.0"
editdistance = "^0.8.1"
torchvision = "0.22.1"
transformers = {extras = ["torch"], version = "4.53.2"}
cairosvg = "^2.8.2"
types-requests = "^2.32.4.20250611"

[tool.poetry.group.docs]
[tool.poetry.group.docs.dependencies]
sphinx = "7.3.7"
furo = "2023.9.10"
myst-parser = "2.0.0"
myst-nb = "1.1.0"

[tool.poetry-dynamic-versioning]
enable = false
vcs = "git"
style = "semver"
pattern = "^v(?P<base>\\d+\\.\\d+\\.\\d+)(-?((?P<stage>[a-zA-Z]+)\\.?(?P<revision>\\d+)?))?"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.black]
target-version = ['py311']
line-length = 100
preview = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C", "B", "S", "A", "INP", "PIE", "PL", "TID252", "T201"]
ignore = ["UP015", "PLC1901", "PLR0913", "S311", "S105", "UP035"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.isort]
profile = "black"
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"

[tool.mypy]
python_version = "3.10"
exclude = ["datasets"]
cache_dir = ".mypy_cache/strict"
show_error_codes = true
show_column_numbers = true
follow_imports = "normal"
warn_no_return = true
warn_return_any = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
implicit_reexport = false
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = 10
testpaths = ["tests"]

[tool.poetry.scripts]
homr = "homr.main:main"
